# Local development stack for Feature 1 (Authentication).
# Later features will extend this file (e.g. adding a queue for AI jobs).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: resumeai
      POSTGRES_USER: resumeai
      POSTGRES_PASSWORD: resumeai
    ports:
      - "5432:5432"
    volumes:
      - resumeai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resumeai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/resumeai
      REDIS_HOST: redis
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  resumeai_pgdata:
