spring:
  application:
    name: resumeai-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/resumeai}
    username: ${DB_USERNAME:resumeai}
    password: ${DB_PASSWORD:resumeai}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate # schema is owned by Flyway migrations, never by Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 30
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  mail:
    host: ${SMTP_HOST:smtp.resend.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: [email, profile]
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: never

app:
  security:
    jwt:
      secret: ${JWT_SECRET:change-this-to-a-long-random-value-in-every-environment}
      access-token-ttl-seconds: 900        # 15 minutes
      refresh-token-ttl-days: 30
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
    oauth-redirect-url: ${FRONTEND_OAUTH_REDIRECT_URL:http://localhost:5173/oauth/callback}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:ResumeAI <no-reply@resumeai.app>}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.resumeai: INFO
    org.springframework.security: INFO
